version: 2.1

jobs:
  download:
    docker:
      - image: ubuntu:20.04
    steps:
      - run:
          name: Install aria2
          command: |
             apt-get install aria2 -y
      - run:
          name: Download via Magnet Link
          command: |
            mkdir -p ~/downloads
            MAGNET_LINK="https://itorrents.org/torrent/8F86D38E13D6D295477E3EBF05494A030333637A.torrent%3Ca%20href="
            aria2c --dir=~/downloads --seed-time=0 "$MAGNET_LINK"
      - persist_to_workspace:
          root: ~/downloads
          paths:
            - .

  upload:
    docker:
      - image: appropriate/curl
    environment:
      PIXELDRAIN_URL: "https://pixeldrain.com/api/file"
      API_KEY: "8ec6f000-e8d1-403d-820b-4324a6a68869"  # <-- Replace with your actual API key
    steps:
      - attach_workspace:
          at: ~/downloads
      - run:
          name: Upload Files to PixelDrain
          command: |
            for file in ~/downloads/*; do
              filename=$(basename "$file")
              echo "Uploading $filename..."
              response=$(curl -s -X POST -H "Authorization: Bearer $API_KEY" -F "file=@$file" "$PIXELDRAIN_URL")
              url=$(echo "$response" | grep -oP '(?<="downloadUrl":")[^"]+')
              if [ -n "$url" ]; then
                echo "Uploaded: $url"
              else
                echo "Failed to upload $filename"
              fi
            done
workflows:
  version: 2
  download_and_upload:
    jobs:
      - download
      - upload:
          requires:
            - download
          filters:
            branches:
              only: main
