version: 2.1

jobs:
  download_and_upload:
    docker:
      - image: cimg/python:3.9
    environment:
      # Set these in your CircleCI project settings for security
      AWS_ACCESS_KEY_ID: F189A7FA8FC1ADA26576
      AWS_SECRET_ACCESS_KEY: DkFntlO7VYWNH64MeN3LeUbLIpAr22AhFkBNsVNq
      B2_BUCKET_NAME: arielle
      ENDPOINT_URL: https://s3.filebase.com
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            pip install awscli
            npm install webtorrent-cli

      - run:
          name: Download torrent
          command: |
            npx webtorrent download "magnet:?xt=urn:btih:8F86D38E13D6D295477E3EBF05494A030333637A&dn=Ke+X.+Space-Time+Coding+Theory+in+Optical+Wireless+MIMO+Systems+2025%20%20%20%20%20%20%20%20&tr=udp://tracker.bittor.pw:1337/announce%20%20%20%20%20%20%20%20&tr=udp://tracker.opentrackr.org:1337/announce%20%20%20%20%20%20%20%20&tr=udp://tracker.dler.org:6969/announce%20%20%20%20%20%20%20%20&tr=udp://open.stealth.si:80/announce%20%20%20%20%20%20%20%20&tr=udp://tracker.torrent.eu.org:451/announce%20%20%20%20%20%20%20%20&tr=udp://exodus.desync.com:6969/announce%20%20%20%20%20%20%20%20&tr=udp://open.demonii.com:1337/announce" --out ./downloads --quiet

      - run:
          name: Configure AWS CLI for Filebase
          command: |
            mkdir -p ~/.aws
            echo "[default]" > ~/.aws/credentials
            echo "aws_access_key_id=${AWS_ACCESS_KEY_ID}" >> ~/.aws/credentials
            echo "aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}" >> ~/.aws/credentials

      - run:
          name: Upload files to Filebase
          command: |
            aws s3 cp ./downloads/ s3://${B2_BUCKET_NAME}/ --recursive --endpoint-url ${ENDPOINT_URL}

      - run:
          name: Clean up downloads
          command: rm -rf ./downloads

workflows:
  version: 2
  upload_workflow:
    jobs:
      - download_and_upload
